name: Checks
on:
  push:
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.2
      - run: uv sync --frozen --python '${{ matrix.python }}'
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q
      - run: python scripts/check-public-tree.py
      - run: uv export --frozen --no-dev --no-emit-project --output-file /tmp/aureax-requirements.txt > /dev/null
      # Pinned like every other supply-chain input in this file: the tool runs
      # against an already-checked-out tree, so an unpinned release is code this
      # job executes sight unseen. The advisory feed is the part meant to move.
      - run: uv tool run pip-audit==2.10.1 -r /tmp/aureax-requirements.txt --no-deps --disable-pip
      - run: uv build
      - name: Test installed artifact outside checkout
        shell: bash
        run: |
          uv venv /tmp/aureax-wheel --python '${{ matrix.python }}'
          uv pip install --python /tmp/aureax-wheel/bin/python dist/*.whl
          cp scripts/check-installed-package.py /tmp/check-aureax-wheel.py
          cd /tmp
          /tmp/aureax-wheel/bin/python /tmp/check-aureax-wheel.py
  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify rules in an isolated network namespace
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/work:ro" -w /work \
            python@sha256:a630a63cdb314e2d138a2fca3e375e319e8568346ffafac5b980f888630ac4f1 \
            sh -c 'apt-get update -qq && apt-get install -y --no-install-recommends iptables >/dev/null && pip install ruamel.yaml==0.19.1 && PYTHONPATH=/work python scripts/check-rpc-firewall.py'
